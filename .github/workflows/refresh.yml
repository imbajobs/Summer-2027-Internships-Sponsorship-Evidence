name: Daily sponsorship evidence refresh
on:
  schedule:
    - cron: '37 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: github-list-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test the self-contained generator
        run: node --test .github/scripts/refresh.test.mjs
      - name: Collect and validate into staging
        run: node .github/scripts/refresh.mjs --out "$RUNNER_TEMP/github-list" --scheduled
      - name: Publish only a completed generation to this repository
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/github-list/README.md"
          test -s "$RUNNER_TEMP/github-list/data/source-snapshot.json"
          test -s "$RUNNER_TEMP/github-list/data/manifest.json"
          cp "$RUNNER_TEMP/github-list/README.md" README.md
          mkdir -p data
          cp "$RUNNER_TEMP/github-list/data/source-snapshot.json" data/source-snapshot.json
          cp "$RUNNER_TEMP/github-list/data/manifest.json" data/manifest.json
          git add README.md data/source-snapshot.json data/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh dated sponsorship evidence'
          git push origin "HEAD:$DEFAULT_BRANCH"
